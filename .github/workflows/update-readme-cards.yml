name: Update README cards

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate private stats token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROFILE_STATS_TOKEN is required for private stats."
            exit 1
          fi

          private_repo_count="$(
            gh api graphql \
              -f query='query { viewer { repositories(affiliations: [OWNER, ORGANIZATION_MEMBER, COLLABORATOR], privacy: PRIVATE, first: 1) { totalCount } } }' \
              --jq '.data.viewer.repositories.totalCount'
          )"

          if [ "$private_repo_count" -eq 0 ]; then
            echo "::error::PROFILE_STATS_TOKEN cannot see any private repositories. Check repo/read:user scopes, fine-grained repository access, and SSO authorization."
            exit 1
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=GitHub%20Stats&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&card_width=600&include_all_commits=true&count_private=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=360&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Update generated date
        run: |
          week="$(date -u +'%V')"
          year="$(date -u +'%G')"
          sed -i "s/<!-- stats-generated -->.*<!-- \\/stats-generated -->/<!-- stats-generated -->Generated: Week ${week}, ${year}<!-- \\/stats-generated -->/" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
