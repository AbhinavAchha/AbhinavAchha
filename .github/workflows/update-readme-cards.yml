name: Update README cards

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Update generated date
        run: |
          week="$(date -u +'%V')"
          year="$(date -u +'%G')"
          sed -i "s/<!-- stats-generated -->.*<!-- \\/stats-generated -->/<!-- stats-generated -->Generated: Week ${week}, ${year}<!-- \\/stats-generated -->/" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
